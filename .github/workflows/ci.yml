name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contributor gate
        run: npm run check

      - name: Verify npm package excludes native tooling and releases
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          const [pack] = JSON.parse(execFileSync('npm', [
            'pack', '--dry-run', '--ignore-scripts', '--json'
          ], { encoding: 'utf8' }))
          for (const { path } of pack.files) {
            if (path.startsWith('build/') || path.includes('native') || /\.(tar\.gz|sha256|exe)$/.test(path)) {
              throw new Error('Native file entered npm package: ' + path)
            }
          }
          JS

  native:
    if: github.ref_type != 'tag'
    needs: check
    uses: ./.github/workflows/native.yml
