name: Native binaries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            sha256: 147d50f9ac298c264c8404cedeb060619de655c6b6c37227714e9ef86e9b7d30
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            sha256: 61cb8fac10ed0f2fc87e216091f13f08183db9f110c73a7adc8e7b83787011fd
          - runner: macos-15
            target: darwin-arm64
            sha256: 2009205e80f1318f3ed610bdf591ac6054c0314a72ea546115adf2e8b168b5e1
          - runner: macos-15-intel
            target: darwin-x64
            sha256: ff0051194a6cfadd8c5c3f36e571ea72630d66d14fa40f1b5fc2af67d8884d0b
    env:
      CC: clang
      TARGET: ${{ matrix.target }}
      COMPILER_SHA256: ${{ matrix.sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Porffor compiler
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/porffor" "$RUNNER_TEMP/native" "$RUNNER_TEMP/assets"
          curl --fail --location --retry 3 \
            "https://github.com/CanadaHonk/porffor/releases/download/alpha-19/porffor-$TARGET.tar.gz" \
            --output "$RUNNER_TEMP/porffor.tar.gz"
          echo "$COMPILER_SHA256  $RUNNER_TEMP/porffor.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/porffor.tar.gz" -C "$RUNNER_TEMP/porffor"
          echo "PORFFOR=$RUNNER_TEMP/porffor/porf" >> "$GITHUB_ENV"

      - name: Compile the existing CLI
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          node build/native.js "$RUNNER_TEMP/native/carta1"

      - name: Verify encoded bytes, decoded WAV, and speed against Node
        shell: bash
        run: |
          python3 - <<'PY'
          import array
          import math
          import os
          import pathlib
          import statistics
          import subprocess
          import threading
          import time
          import wave

          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'parity'
          work.mkdir()
          native = str(work.parent / 'native' / 'carta1')
          hosts = {'node': ['node', 'bin/cli.js'], 'native': [native]}
          samples = array.array('h')
          seed = 7
          for index in range(44100 * 180):
              seed = (1664525 * seed + 1013904223) & 0xffffffff
              noise = ((seed >> 16) - 32768) / 8
              tone = 10000 * math.sin(index * 2 * math.pi * 440 / 44100)
              transient = noise * (4 if index % 8192 < 256 else 1)
              samples.extend((int(tone + transient), int(tone - transient)))

          for width in (2, 3, 4):
              pcm = bytearray(len(samples) * width)
              for index, sample in enumerate(samples):
                  value = sample << (8 * (width - 2))
                  pcm[index * width:(index + 1) * width] = value.to_bytes(
                      width, 'little', signed=True
                  )
              with wave.open(str(work / f'pcm{width * 8}.wav'), 'wb') as output:
                  output.setparams((2, width, 44100, 0, 'NONE', ''))
                  output.writeframes(pcm)

          def run(host, operation, source, output):
              args = hosts[host] + ['--' + operation, '-qf']
              if operation == 'encode':
                  args += ['--title', 'Parity 音 🎵']
              start = time.perf_counter()
              process = subprocess.Popen(args + [str(source), str(output)])
              timer = threading.Timer(90, process.kill)
              timer.start()
              status = process.wait()
              timer.cancel()
              if status:
                  raise RuntimeError(f'{host} {operation} exited with {status}')
              return time.perf_counter() - start

          reference = work / 'reference.aea'
          run('node', 'encode', work / 'pcm16.wav', reference)
          decoded = work / 'reference.wav'
          run('node', 'decode', reference, decoded)
          expected = {'encode': reference.read_bytes(), 'decode': decoded.read_bytes()}
          cases = [('encode', work / f'pcm{bits}.wav') for bits in (16, 24, 32)]
          cases.append(('decode', reference))
          report = []
          for operation, source in cases:
              timings = {host: [] for host in hosts}
              for repeat in range(5):
                  order = list(hosts) if repeat % 2 == 0 else list(reversed(hosts))
                  for host in order:
                      output = work / f'{host}-output'
                      timings[host].append(run(host, operation, source, output))
                      if output.read_bytes() != expected[operation]:
                          raise RuntimeError(f'{host} {operation} parity failed: {source.name}')
              medians = {host: statistics.median(values) for host, values in timings.items()}
              row = f'{operation} {source.name}: Node {medians["node"]:.3f}s; native {medians["native"]:.3f}s'
              print(row, flush=True)
              report.append(row)
              # Shared runners have timing noise; reject regressions above 5%.
              if medians['native'] > medians['node'] * 1.05:
                  raise RuntimeError('Native speed gate failed: ' + row)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join('- ' + row for row in report) + '\n')
          PY

      - name: Archive native binary
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/assets/carta1-$TARGET.tar.gz" -C "$RUNNER_TEMP/native" carta1
          cd "$RUNNER_TEMP/assets"
          shasum -a 256 "carta1-$TARGET.tar.gz" > "carta1-$TARGET.tar.gz.sha256"

      - name: Upload verified native binary
        uses: actions/upload-artifact@v7
        with:
          name: carta1-native-${{ matrix.target }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          retention-days: 7
